services:
  - type: web
    name: lizka
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --preload --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # Render попросить ввести пароль вручну
      - key: DATABASE_URL
        fromDatabase:
          name: lizka-db
          property: connectionString

databases:
  - name: lizka-db
    plan: free
    databaseName: lizka
    user: lizka
