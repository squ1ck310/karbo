<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Karbo{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/karbo-icon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Big Shoulders і Hanken — з шаблону Karbo; Oswald і Manrope підхоплюють кирилицю, якої в перших немає -->
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;600&family=Oswald:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/karbo.css') }}">
</head>
<body>

  <!-- Логотип KARBO: намальований один раз і перевикористаний -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="logo" viewBox="92 20 520 244"><g fill="none" stroke="currentColor" stroke-width="16" stroke-miterlimit="10">
      <g transform="translate(104,150)"><path d="M8 0V100M70 0L8 56M30 40L74 100"/></g>
      <g transform="translate(210,150)"><path d="M0 100L38 0L76 100M18 70H58"/></g>
      <g transform="translate(312,150)"><path d="M8 0V100M8 8H50L70 22V40L50 54H8M40 54L74 100"/></g>
      <g transform="translate(414,150)"><path d="M8 0V100M8 8H52L70 22V38L52 50H8M8 50H56L76 64V86L56 100H8"/></g>
      <g transform="translate(520,150)"><path d="M22 8H54L72 28V72L54 92H22L4 72V28Z"/></g>
      <path d="M350 36V122M322 62H378" stroke-width="9"/></g></symbol>
  </defs></svg>

  <header class="bar">
    <a href="{{ url_for('index') }}" class="bar-logo" aria-label="Karbo, на головну"><svg viewBox="0 0 520 244" width="96" role="img" aria-label="KARBO"><use href="#logo" width="520" height="244"/></svg></a>
    <nav aria-label="Головне меню">
      <a href="{{ url_for('index') }}#shop">Магазин</a>
      <a href="{{ url_for('index') }}#about">Про нас</a>
      <a href="#contact">Контакти</a>
      <button class="cartbtn" id="cartOpen" aria-label="Відкрити кошик">Кошик (<span id="cartCount">{{ cart_count|default(0) }}</span>)</button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer id="contact">
    <div><b>Karbo</b><br>© 2026</div>
    <div><a href="#">Instagram</a><a href="#">TikTok</a><a href="#">Pinterest</a></div>
    <div><a href="#">Доставка</a><a href="#">Повернення</a><a href="#">Таблиця розмірів</a></div>
  </footer>

  <!-- Модалка товару -->
  <div class="modal" id="productModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="x modal-close" data-close>Закрити</button>
      <div class="modal-gallery">
        <div class="modal-img" id="modalImg"></div>
        <div class="modal-thumbs" id="modalThumbs"></div>
      </div>
      <div class="modal-info">
        <h3 id="modalTitle"></h3>
        <p class="price" id="modalPrice"></p>
        <p class="modal-desc" id="modalDesc"></p>
        <p class="size-label">Розмір</p>
        <div class="sizes" id="modalSizes"></div>
        <button class="btn" id="modalAdd">Додати в кошик</button>
      </div>
    </div>
  </div>

  <!-- Кошик -->
  <aside class="drawer" id="cartDrawer" aria-label="Кошик" hidden>
    <div class="drawer-backdrop" data-close-cart></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <h3>Кошик</h3>
        <button class="x" data-close-cart>Закрити</button>
      </div>
      <ul class="cart-list" id="cartList"></ul>

      <form class="checkout" id="checkoutForm" hidden novalidate>
        <button type="button" class="back-link" id="checkoutBack">Назад до кошика</button>
        <label>Імʼя та прізвище <input name="name" autocomplete="name" required></label>
        <label>Телефон <input name="phone" type="tel" autocomplete="tel" placeholder="+380" required></label>
        <label>Місто <input name="city" autocomplete="address-level2" required></label>
        <label data-np>Відділення Нової Пошти <input name="branch" placeholder="№ 12"></label>
        <div class="addr" data-addr hidden>
          <p class="addr-note">У кошику є речі, які друкуємо на замовлення. Вони їдуть кур'єром на адресу, а не на відділення.</p>
          <label>Країна
            <select name="country">
              {% for code, name in COUNTRIES.items() %}<option value="{{ code }}">{{ name }}</option>{% endfor %}
            </select>
          </label>
          <label>Вулиця, будинок, квартира <input name="address" autocomplete="street-address"></label>
          <label>Поштовий індекс <input name="zip" autocomplete="postal-code" inputmode="numeric"></label>
          <label>Email <input name="email" type="email" autocomplete="email" placeholder="для трек-номера"></label>
        </div>
        <label>Коментар <textarea name="comment" rows="2"></textarea></label>
      </form>

      <div class="checkout-done" id="checkoutDone" hidden></div>

      <div class="drawer-foot" id="drawerFoot">
        <div class="total"><span>Разом</span><strong id="cartTotal">0 ₴</strong></div>
        <button class="btn" id="checkoutBtn">Оформити замовлення</button>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
