{% extends "admin/base.html" %}
{% block title %}{{ p.name or 'Новий товар' }}{% endblock %}
{% block content %}
<div class="admin-head">
  <h1>{{ p.name if p.id else 'Новий товар' }}</h1>
  <a href="{{ url_for('admin.products') }}">До списку товарів</a>
</div>
<form method="post" class="panel product-form">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="form-grid">
    <label>Назва <input name="name" value="{{ p.name or '' }}" required maxlength="120"></label>
    <label>Категорія
      <select name="category">
        {% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if c.id == p.category }}>{{ c.name }}</option>{% endfor %}
      </select>
    </label>
    <label>Ціна, ₴ <input name="price" type="number" min="1" step="1" value="{{ p.price or '' }}" required></label>
    <label>Розміри через кому <input name="sizes" value="{{ p.sizes or '' }}" placeholder="XS,S,M,L" required></label>
    <label>Бейдж (необовʼязково) <input name="badge" value="{{ p.badge or '' }}" placeholder="Новинка" maxlength="30"></label>
    <label>Силует
      <select name="shape">
        {% for key, name in shapes.items() %}<option value="{{ key }}" {{ 'selected' if key == p.shape }}>{{ name }}</option>{% endfor %}
      </select>
    </label>
    <label>Колір речі <input name="color" type="color" value="{{ p.color }}"></label>
    <label>Колір фону <input name="bg" type="color" value="{{ p.bg }}"></label>
    <label class="wide">Опис <textarea name="desc" rows="4">{{ p.desc or '' }}</textarea></label>
    <label class="check"><input type="checkbox" name="is_active" {{ 'checked' if p.is_active }}> Показувати на сайті</label>
  </div>
  <button class="btn btn-primary">Зберегти товар</button>
</form>
{% endblock %}
